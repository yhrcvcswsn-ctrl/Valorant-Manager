        function getStartingPlayers() {
            if (!state || !Array.isArray(state.players)) return [];
            const starters = state.players.filter(p => p.isStarter !== false);
            return starters.slice(0, 5);
        }

        function calculateTeamPower() {
            const starters = getStartingPlayers();
            if (starters.length === 0) return 0;
            const avgOvr = starters.reduce((sum, p) => sum + p.ovr, 0) / starters.length;
            return Math.round(avgOvr * 0.75 + (state.form * 0.15) + (state.morale * 0.05) + (state.coach * 0.05));
        }

        function simulateCpuMatches(userOpponentName = null) {
            const currentTeams = state.tier === 1 ? state.t1Teams : state.t2Teams;
            const cpuTeams = currentTeams.filter(t => t.name !== state.myTeamName && t.name !== userOpponentName);
            const shuffled = [...cpuTeams].sort(() => Math.random() - 0.5);

            for (let i = 0; i < shuffled.length - 1; i += 2) {
                const teamA = shuffled[i];
                const teamB = shuffled[i+1];

                const powerA = teamA.power + (Math.random() * 24 - 12);
                const powerB = teamB.power + (Math.random() * 24 - 12);

                if (powerA >= powerB) {
                    teamA.w++;
                    teamB.l++;
                } else {
                    teamB.w++;
                    teamA.l++;
                }
            }
        }

        function checkTop4Qualification() {
            const currentTeams = state.tier === 1 ? state.t1Teams : state.t2Teams;
            let sortedTeams = [...currentTeams].filter(t => !t.academy).sort((a, b) => (b.w - a.w) || (b.power - a.power));
            const myRank = sortedTeams.findIndex(t => t.name === state.myTeamName) + 1;
            return myRank > 0 && myRank <= 4;
        }

        function getInternationalMatchTarget(type) { return type === 'champions' ? 7 : 6; }

        function getInternationalTournamentTeams() {
            const pool = [];
            Object.entries(VCT_DATA).forEach(([regionKey, reg]) => {
                const teams = state.tier === 1 ? (reg.t1 || []) : (reg.t2 || []);
                teams.filter(t => !t.academy).forEach(t => pool.push({ ...t, regionKey, regionName: reg.name }));
            });

            // 현재 팀이 VCT_DATA의 이름과 정확히 일치하지 않는 저장 데이터도 복구한다.
            let mine = pool.find(t => t.name === state.myTeamName);
            if (!mine) {
                const currentTeams = state.tier === 1 ? (state.t1Teams || []) : (state.t2Teams || []);
                const savedMine = currentTeams.find(t => t.name === state.myTeamName);
                if (savedMine) {
                    mine = {
                        ...savedMine,
                        regionKey: state.regionKey,
                        regionName: state.regionName || state.regionKey || '내 권역'
                    };
                }
            }

            const others = pool
                .filter(t => t.name !== state.myTeamName)
                .sort(() => Math.random() - 0.5);
            const otherRegions = others.filter(t => t.regionKey !== state.regionKey);
            const selected = [];

            // mine이 undefined여도 배열 길이를 잘못 계산하지 않도록 명시적으로 push한다.
            if (mine) selected.push(mine);
            for (const team of [...otherRegions, ...others]) {
                if (selected.length >= 8) break;
                if (!selected.some(x => x.name === team.name)) selected.push(team);
            }

            return selected.slice(0, 8);
        }

        function buildInternationalTournament(type) {
            const teams = getInternationalTournamentTeams();
            const m = {};
            const add=(id,round,a,b)=>m[id]={id,round,a,b,status:'pending',winner:null,loser:null,scoreA:null,scoreB:null};
            add('ub1_0','UPPER R1',teams[0]?.name,teams[1]?.name); add('ub1_1','UPPER R1',teams[2]?.name,teams[3]?.name);
            add('ub1_2','UPPER R1',teams[4]?.name,teams[5]?.name); add('ub1_3','UPPER R1',teams[6]?.name,teams[7]?.name);
            add('ub2_0','UPPER R2',{source:'ub1_0',kind:'winner'},{source:'ub1_1',kind:'winner'});
            add('ub2_1','UPPER R2',{source:'ub1_2',kind:'winner'},{source:'ub1_3',kind:'winner'});
            add('ubf','UPPER FINAL',{source:'ub2_0',kind:'winner'},{source:'ub2_1',kind:'winner'});
            add('lb1_0','LOWER R1',{source:'ub1_0',kind:'loser'},{source:'ub1_1',kind:'loser'});
            add('lb1_1','LOWER R1',{source:'ub1_2',kind:'loser'},{source:'ub1_3',kind:'loser'});
            add('lb2_0','LOWER R2',{source:'lb1_0',kind:'winner'},{source:'ub2_0',kind:'loser'});
            add('lb2_1','LOWER R2',{source:'lb1_1',kind:'winner'},{source:'ub2_1',kind:'loser'});
            add('lb3','LOWER R3',{source:'lb2_0',kind:'winner'},{source:'lb2_1',kind:'winner'});
            add('lbf','LOWER FINAL',{source:'lb3',kind:'winner'},{source:'ubf',kind:'loser'});
            add('gf','GRAND FINAL',{source:'ubf',kind:'winner'},{source:'lbf',kind:'winner'});
            return { schemaVersion: 3, year: state.year, type, name:type==='masters1'?'Masters 1':type==='masters2'?'Masters 2':'Champions', teams, matches:m, status:'active', playerMatchId:null, result:null };
        }

        function archiveInternationalTournament(tournament) {
            if (!state || !tournament || !tournament.matches) return;
            if (!Array.isArray(state.internationalHistory)) state.internationalHistory = [];
            const key = `${tournament.year || state.year}:${tournament.type}:${tournament.name}`;
            const exists = state.internationalHistory.some(x => `${x.year || ''}:${x.type || ''}:${x.name || ''}` === key);
            if (exists) return;
            try {
                const copy = JSON.parse(JSON.stringify(tournament));
                copy.archivedAt = Date.now();
                state.internationalHistory.unshift(copy);
                // 오래된 대회도 충분히 볼 수 있도록 최근 12개까지 보관
                state.internationalHistory = state.internationalHistory.slice(0, 12);
            } catch (e) {
                console.warn('국제대회 기록 보관 실패', e);
            }
        }

        function showInternationalHistory(index) {
            state.internationalHistoryView = Number.isInteger(index) ? index : null;
            renderApp();
        }

        function ensureInternationalTournament(type) {
            if (!state || !['masters1','masters2','champions'].includes(type)) return null;
            const current = state.internationalTournament;

            // 핵심 수정:
            // 대회가 끝난 직후 playMatch()가 renderApp()을 먼저 호출한다.
            // 이때 같은 주차/같은 대회의 status가 champion/runnerup/eliminated인데
            // 이전 코드는 status !== 'active'를 이유로 새 대회를 다시 만들었다.
            // 그 결과 '8팀 더블 엘리미네이션 토너먼트가 개막했습니다.'가 무한 반복됐다.
            // 같은 시즌 + 같은 대회 타입이면 상태가 active가 아니어도 절대 재생성하지 않는다.
            const sameEvent = current && current.type === type && Number(current.year || state.year) === Number(state.year);
            if (sameEvent) {
                // 구버전 저장 데이터는 구조가 최소한 존재할 때 그대로 보존한다.
                // 렌더링 함수가 저장 데이터를 파괴하거나 재생성하지 않도록 한다.
                current.year = state.year;
                current.schemaVersion = Math.max(Number(current.schemaVersion) || 0, 3);
                if (current.status === 'active') {
                    intlPrepareNextPlayerMatch(false);
                }
                return current;
            }

            // 다른 국제대회 타입이거나 다음 시즌이면 새 대회를 한 번만 만든다.
            // 기존 대회는 절대 덮어쓰지 않고 먼저 역사 기록으로 보관한다.
            if (current && current.matches) archiveInternationalTournament(current);
            const tournament = buildInternationalTournament(type);
            if (!tournament || !Array.isArray(tournament.teams) || tournament.teams.length < 8) {
                return null;
            }
            tournament.schemaVersion = 3;
            tournament.year = state.year;
            state.internationalTournament = tournament;
            state.internationalPhaseType = type;
            state.internationalMatchesPlayed = 0;
            state.internationalMatchTarget = getInternationalMatchTarget(type);
            state.logs.push(`🌍 [${state.year} ${tournament.name}] 8팀 더블 엘리미네이션 토너먼트가 개막했습니다.`);
            intlPrepareNextPlayerMatch(false);
            return tournament;
        }

        function validateInternationalBracket() {
            const t = state?.internationalTournament;
            if (!t || t.status !== 'active' || !t.matches) return false;
            const ids = ['ub1_0','ub1_1','ub1_2','ub1_3','ub2_0','ub2_1','ubf','lb1_0','lb1_1','lb2_0','lb2_1','lb3','lbf','gf'];
            if (ids.some(id => !t.matches[id])) return false;

            // 완료된 경기는 반드시 실제 팀 이름(문자열)만 저장해야 한다.
            // 이전 버전에서 source 객체가 winner/loser로 저장되면 국제대회 화면이
            // 계속 같은 상태를 처리하면서 멈추거나 반복되는 문제가 발생할 수 있다.
            for (const id of ids) {
                const m = t.matches[id];
                if (!m || !['pending','done'].includes(m.status)) return false;
                if (m.status === 'done') {
                    if (typeof m.winner !== 'string' || typeof m.loser !== 'string') return false;
                    if (!Number.isFinite(m.scoreA) || !Number.isFinite(m.scoreB)) return false;
                    if (![m.a,m.b].every(v => typeof v === 'string')) return false;
                } else {
                    for (const side of ['a','b']) {
                        const v = m[side];
                        if (typeof v !== 'string' && !(v && typeof v === 'object' && typeof v.source === 'string' && (v.kind === 'winner' || v.kind === 'loser'))) return false;
                    }
                }
            }
            return true;
        }

        function intlResolveSource(source) {
            if (typeof source === 'string') return source;
            if (!source || typeof source !== 'object') return null;
            const sm = state.internationalTournament?.matches?.[source.source];
            if (!sm || sm.status !== 'done') return null;
            const resolved = source.kind === 'winner' ? sm.winner : sm.loser;
            return typeof resolved === 'string' ? resolved : null;
        }

        function intlRefreshMatch(match) {
            if (!match || match.status !== 'pending') return match;
            // source 경기는 끝난 경우에만 문자열 팀명으로 확정한다.
            // 아직 끝나지 않았으면 source 객체를 그대로 유지한다.
            for (const side of ['a','b']) {
                if (match[side] && typeof match[side] === 'object') {
                    const resolved = intlResolveSource(match[side]);
                    if (resolved) match[side] = resolved;
                }
            }
            return match;
        }

        function intlPower(teamName) {
            if (teamName === state.myTeamName) return calculateTeamPower();
            const t = state.internationalTournament?.teams?.find(x => x.name === teamName); return t ? t.power : 70;
        }

        function intlTeamMeta(name) {
            const t = state.internationalTournament?.teams?.find(x => x.name === name);
            return t || {name:name || 'TBD',abbr:(name||'TBD').slice(0,3).toUpperCase(),color:'bg-gray-800 text-white',regionName:'-'};
        }

        function intlResolveCpuMatch(match) {
            intlRefreshMatch(match);
            // 양쪽이 실제 팀 이름으로 확정된 경기만 CPU가 처리한다.
            if (!match || match.status !== 'pending' || typeof match.a !== 'string' || typeof match.b !== 'string') return false;
            if (match.a === state.myTeamName || match.b === state.myTeamName) return false;
            const pa = intlPower(match.a) + (Math.random()*12-6), pb = intlPower(match.b) + (Math.random()*12-6), winA = pa >= pb;
            match.winner = winA ? match.a : match.b;
            match.loser = winA ? match.b : match.a;
            match.scoreA = winA ? 2 : Math.floor(Math.random()*2);
            match.scoreB = winA ? (match.scoreA === 2 && Math.random() > .65 ? 1 : 0) : 2;
            if (match.scoreA === match.scoreB) match.scoreB = winA ? 1 : 2;
            match.status = 'done';
            return true;
        }

        function intlPrepareNextPlayerMatch(resolveCpu = true) {
            const t = state.internationalTournament;
            if (!t || t.status !== 'active' || !t.matches) return;

            // 이미 완료된 소스의 결과를 다음 라운드에 연결한다.
            for (const match of Object.values(t.matches)) {
                if (match.status === 'pending') intlRefreshMatch(match);
            }

            // 먼저 내 경기를 찾는다.
            const findPlayerMatch = () => Object.values(t.matches).find(match =>
                match.status === 'pending' &&
                typeof match.a === 'string' && typeof match.b === 'string' &&
                (match.a === state.myTeamName || match.b === state.myTeamName)
            );

            let playerMatch = findPlayerMatch();
            if (playerMatch) {
                t.playerMatchId = playerMatch.id;
                return playerMatch;
            }

            if (!resolveCpu) {
                t.playerMatchId = null;
                return null;
            }

            // 내 경기가 만들어질 때까지 CPU 경기만 한 번씩 진행한다.
            // 최대 30회로 제한하여 어떤 저장 데이터에서도 무한 루프가 발생하지 않게 한다.
            for (let guard = 0; guard < 30; guard++) {
                let progressed = false;
                for (const match of Object.values(t.matches)) {
                    if (match.status !== 'pending') continue;
                    intlRefreshMatch(match);
                    if (intlResolveCpuMatch(match)) {
                        progressed = true;
                        break;
                    }
                }
                playerMatch = findPlayerMatch();
                if (playerMatch) {
                    t.playerMatchId = playerMatch.id;
                    return playerMatch;
                }
                if (!progressed) break;
            }
            t.playerMatchId = null;
            return null;
        }

        function getInternationalOpponent() {
            const t = state.internationalTournament;
            if (!t || t.status !== 'active') return null;

            intlPrepareNextPlayerMatch(true);
            let m = t.matches?.[t.playerMatchId];

            // 저장 데이터가 꼬여 playerMatchId가 비어 있어도 현재 팀이 참가 중인 대기 경기를 직접 찾는다.
            if (!m) {
                for (const candidate of Object.values(t.matches || {})) {
                    if (candidate.status !== 'pending') continue;
                    intlRefreshMatch(candidate);
                    if (candidate.a && candidate.b && (candidate.a === state.myTeamName || candidate.b === state.myTeamName)) {
                        t.playerMatchId = candidate.id;
                        m = candidate;
                        break;
                    }
                }
            }

            if (!m) return null;
            const opponentName = m.a === state.myTeamName ? m.b : m.a;
            if (!opponentName) return null;
            return intlTeamMeta(opponentName);
        }

                                    ${state.sponsorDealsUsed >= state.sponsorDealsMax ? '계약 한도' : '+$70,000'}

                            <div class="flex justify-between text-sm py-1.5 border-b border-val-border/60 pb-3"><span class="text-val-muted">선수단 주급 총액</span><span class="text-white font-semibold">${formatMoney(weeklyWages)}</span></div>

        function renderLeagueView() {
            const isT1 = state.tier === 1;
            const currentTeams = isT1 ? state.t1Teams : state.t2Teams;
            let sortedTeams = [...currentTeams].sort((a, b) => (b.w - a.w) || (b.power - a.power));
            const phase = getPhaseName(state.week);

            const tableRows = sortedTeams.map((t, idx) => {
                const isMyTeam = t.name === state.myTeamName;
                let rowBg = isMyTeam ? "bg-val-red/15 border-l-4 border-val-red" : "border-b border-val-border/50";
                const isTop4 = idx < 4;
                
                return `
                <tr class="${rowBg} hover:bg-val-border/30 transition text-sm">
                    <td class="py-3 px-4 font-bold ${isTop4 ? 'text-yellow-400' : 'text-gray-300'}">
                        ${idx + 1} ${isTop4 ? '<span class="text-[10px] bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-1 py-0.5 rounded ml-1">TOP 4</span>' : ''}
                    </td>
                    <td class="py-3 px-4 font-bold text-white flex items-center gap-2.5">
                        ${renderTeamLogo(t, "w-7 h-7 text-xs")} 
                        <span>${t.name}</span>

                    </td>
                    <td class="py-3 px-4 text-center font-semibold text-val-muted">${t.power}</td>
                    <td class="py-3 px-4 text-center font-bold text-green-400">${t.w}</td>
                    <td class="py-3 px-4 text-center font-bold text-val-red">${t.l}</td>
                </tr>
                `;
            }).join("");

            return `
                <div class="bg-val-panel border border-val-border rounded-xl p-5">
                    <div class="flex justify-between items-center border-b border-val-border pb-3 mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-white">${state.year} ${state.regionName} ${isT1 ? '1부 VCT League' : '2부 Challengers'} 순위</h2>
                            <p class="text-xs text-val-accent mt-0.5">상위 4개 팀만 국제대회(마스터즈/챔피언스)에 진출합니다. (현재 단계: ${phase.name})</p>

                    </div>

                                    <th class="py-2.5 px-4 text-center">패</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function generateYouthProspects(count = 2) {
            if (!careerActionAllowed()) return;
            if (!state) return;
            if (!Array.isArray(state.youth)) state.youth = [];
            const pool = ["Nova","Rin","Milo","Kite","Vex","Ari","Nox","Lumi","Kiro","Zeno","Mira","Juno","Sena","Rex"];
            for (let i=0;i<count;i++) { const r=ROLES[Math.floor(Math.random()*5)]; state.youth.push({id:'y_'+Math.random().toString(36).substr(2,9),name:pool[Math.floor(Math.random()*pool.length)]+Math.floor(10+Math.random()*90),role:r.id,agent:r.agents[Math.floor(Math.random()*r.agents.length)],ovr:58+Math.floor(Math.random()*11),potential:78+Math.floor(Math.random()*22),age:16+Math.floor(Math.random()*3),training:0,salary:16000+Math.floor(Math.random()*12000),stats:{matches:0,kills:0,deaths:0,assists:0,acsSum:0,mvpCount:0}}); }
        }
        function trainYouth(index) {
            if (!careerActionAllowed()) return;
            const y=state?.youth?.[index]; if(!y) return; const cost=7000+state.youthLevel*2500;
            if(state.cash<cost){showToast("유스 훈련비가 부족합니다!");return;} if(y.ovr>=y.potential){showToast(`${y.name}은(는) 잠재력에 도달했습니다.`);return;}
            state.cash-=cost; if (checkBankruptcy()) return; const gain=Math.min(y.potential-y.ovr,1+Math.floor(Math.random()*3)); y.ovr+=gain; y.training++; state.logs.push(`🌱 [유스 훈련] ${y.name} OVR +${gain}`); showToast(`${y.name} 성장! OVR ${y.ovr}`); renderApp();
        }
        function upgradeYouthAcademy() {
            if (!careerActionAllowed()) return;
            const cost=80000*state.youthLevel; if(state.youthLevel>=5){showToast("유스 아카데미가 최대 레벨입니다.");return;} if(state.cash<cost){showToast("아카데미 강화 비용이 부족합니다!");return;} state.cash-=cost; if (checkBankruptcy()) return; state.youthLevel++; state.logs.push(`🏫 [유스 아카데미] Lv.${state.youthLevel}`); showToast(`유스 아카데미 Lv.${state.youthLevel}!`); renderApp();
        }
        function promoteYouth(index) {
            const y=state?.youth?.[index]; if(!y)return; if(state.players.length>=6){showToast("1군 로스터가 가득 찼습니다.");return;} if(y.ovr<70){showToast("아직 1군 콜업에는 성장이 더 필요합니다.");return;} state.players.push({...y,id:'p_'+Math.random().toString(36).substr(2,9),isStarter:state.players.length<5,promoted:true}); state.youth.splice(index,1); state.logs.push(`⬆️ [유스 콜업] ${y.name}이(가) 1군에 합류했습니다.`); showToast(`${y.name} 1군 콜업 완료!`); renderApp();
        }
        function releaseYouth(index) { const y=state?.youth?.[index]; if(!y)return; state.youth.splice(index,1); state.logs.push(`🚪 [유스 방출] ${y.name}`); showToast(`${y.name} 방출 완료`); renderApp(); }
        function renderYouthView() {
            if(!state.youth) state.youth=[];
            const cards=state.youth.map((y,i)=>{const r=getRoleConfig(y.role);const pct=Math.min(100,Math.round(y.ovr/y.potential*100));return `<div class="bg-val-dark border border-val-border rounded-xl p-4"><div class="flex justify-between"><div><div class="text-lg font-black text-white">${y.name}</div><div class="text-xs ${r.color} font-bold">${r.icon} ${y.role} · ${y.agent} · ${y.age}세</div></div><div class="text-right"><div class="text-2xl font-black text-val-accent">${y.ovr}</div><div class="text-[10px] text-val-muted">OVR / 잠재력 ${y.potential}</div></div></div><div class="h-1.5 bg-val-panel rounded mt-3"><div class="h-full bg-val-accent rounded" style="width:${pct}%"></div></div><div class="grid grid-cols-3 gap-2 mt-4"><button onclick="trainYouth(${i})" class="bg-val-panel hover:bg-val-border text-white font-bold py-2 rounded-lg text-xs">훈련</button><button onclick="promoteYouth(${i})" class="bg-val-red hover:bg-val-redHover text-white font-bold py-2 rounded-lg text-xs">1군 콜업</button><button onclick="releaseYouth(${i})" class="bg-val-panel hover:bg-val-border text-val-muted font-bold py-2 rounded-lg text-xs">방출</button></div></div>`}).join('');
            return `<div class="flex flex-col gap-5"><div class="bg-val-panel border border-val-border rounded-xl p-5"><div class="flex flex-col md:flex-row md:justify-between md:items-center gap-3"><div><h2 class="text-xl font-black text-white">🌱 유스 아카데미</h2><p class="text-xs text-val-muted mt-1">유망주를 발굴하고 성장시켜 1군의 차세대 선수로 키워보세요.</p></div><div class="flex gap-2"><button onclick="generateYouthProspects(2);renderApp();showToast('새 유망주 2명이 입단했습니다.')" class="bg-val-red text-white font-bold px-4 py-2 rounded-lg text-xs">유망주 스카우트</button><button onclick="upgradeYouthAcademy()" class="bg-val-panel border border-val-border text-white font-bold px-4 py-2 rounded-lg text-xs">아카데미 강화</button></div></div><div class="grid grid-cols-3 gap-3 mt-4"><div class="bg-val-dark rounded-lg p-3"><div class="text-[10px] text-val-muted">유스 인원</div><div class="text-xl font-black text-white">${state.youth.length}</div></div><div class="bg-val-dark rounded-lg p-3"><div class="text-[10px] text-val-muted">아카데미 레벨</div><div class="text-xl font-black text-val-accent">Lv.${state.youthLevel}</div></div><div class="bg-val-dark rounded-lg p-3"><div class="text-[10px] text-val-muted">스카우트/훈련 자금</div><div class="text-xl font-black text-white">${formatMoney(state.cash)}</div></div></div></div><div class="grid md:grid-cols-2 gap-4">${cards||`<div class="md:col-span-2 bg-val-panel border border-val-border rounded-xl p-8 text-center text-val-muted">현재 유스 선수가 없습니다. 유망주를 스카우트하세요.</div>`}</div></div>`;
        }

        function renderPageContent() {
            switch (currentPage) {
                case "dashboard": return renderDashboardView();
                case "roster": return renderRosterView();
                case "market": return renderMarketView();
                case "training": return renderTrainingView();
                case "youth": return renderYouthView();
                case "finance": return renderFinanceView();
                case "league": return renderLeagueView();
                case "international":
                    try { return renderInternationalView(); }
                    catch (e) {
                        console.error('International render error:', e);
                        return `<div class="bg-val-panel border border-val-red/40 rounded-xl p-6"><h2 class="text-xl font-black text-white">국제대회 화면 오류를 복구했어</h2><p class="text-sm text-val-muted mt-2">브래킷 데이터를 초기화하지 않고 화면만 복구할 수 있어.</p><button onclick="resetInternationalTournament('${getPhaseName(state.week).type}')" class="mt-4 bg-val-red text-white font-bold px-4 py-2 rounded-lg">국제대회 복구</button></div>`;
                    }
                case "world_ranking": return renderWorldRankingView();
                case "trophies": return renderTrophyCabinetView();
                case "stats": return renderStatsView();
                case "match_report": return renderMatchReportView();
                default: return renderDashboardView();
            }
        }

        function getWorldRankingTeams() {
            const all = [];
            Object.entries(VCT_DATA).forEach(([regionKey, reg]) => {
                const pool = state.tier === 1 ? reg.t1 : reg.t1;
                pool.filter(t => !t.academy).forEach(t => {
                    const local = (state.regionKey === regionKey && state.t1Teams)
                        ? state.t1Teams.find(x => x.name === t.name) : null;
                    const isMe = t.name === state.myTeamName;
                    const power = isMe ? calculateTeamPower() : (local ? local.power : t.power);
                    const w = local ? local.w : 0;
                    const l = local ? local.l : 0;
                    const internationalBonus = isMe ? (state.trophies || []).length * 35 : 0;
                    const score = Math.round(power * 15 + w * 22 - l * 12 + internationalBonus);
                    all.push({ name:t.name, abbr:t.abbr, color:t.color, regionKey, regionName:reg.name, power, w, l, score, isMe });
                });
            });
            return all.sort((a,b) => b.score - a.score || b.power - a.power);
        }

        function renderInternationalMatchCard(match, tournament = state.internationalTournament, archived = false) {
            if (!match) return '';
            const t = tournament || {};
            const resolve = (source) => {
                if (typeof source === 'string') return source;
                if (!source || typeof source !== 'object') return null;
                const sm = t.matches?.[source.source];
                if (!sm || sm.status !== 'done') return null;
                return source.kind === 'winner' ? sm.winner : sm.loser;
            };
            const getMeta = (name) => {
                const found = (t.teams || []).find(x => x.name === name);
                return found || {name:name || 'TBD', abbr:(name || 'TBD').slice(0,3).toUpperCase(), color:'bg-gray-800 text-white', regionName:'-'};
            };
            const aName = resolve(match.a), bName = resolve(match.b);
            const a = getMeta(aName), b = getMeta(bName);
            const active = !archived && state.internationalTournament?.playerMatchId === match.id && match.status === 'pending';
            const row=(team,score)=>{const me=team?.name===state.myTeamName, win=match.status==='done'&&match.winner===team?.name;return `<div class="intl-team-row ${me?'me ':''}${win?'winner':''}">${team?.name?`<span class="flex items-center gap-1.5 min-w-0">${renderTeamLogo(team,'w-5 h-5 text-[9px]')}<span class="intl-team-name">${team.name}</span></span>`:'<span class="intl-team-name text-val-muted">TBD</span>'}<span class="intl-score ${win?'text-green-400':''}">${match.status==='done'?score:'-'}</span></div>`};
            return `<div class="intl-match ${active?'active':''} ${match.status==='done'?'done':''}"><div class="intl-match-name">${match.round} ${active?'· NEXT MATCH':''}</div>${row(a,aName&&match.status==='done'&&match.a===aName?match.scoreA:match.scoreA)}${row(b,bName&&match.status==='done'&&match.b===bName?match.scoreB:match.scoreB)}</div>`;
        }

        function renderInternationalBracket(t, archived = false) {
            if (!t || !t.matches) return '';
            const m=t.matches;
            const trophyImg=t.type==='champions'?TROPHY_IMAGES.champions:TROPHY_IMAGES.masters;
            const cards=(ids)=>ids.map(id=>m[id]?renderInternationalMatchCard(m[id],t,archived):'').join('');
            const col=(title,ids,cls='')=>`<div class="bracket-v2-col ${cls}"><div class="bracket-v2-title">${title}</div>${cards(ids)}</div>`;
            const statusLabel=t.status==='active'?'TOURNAMENT LIVE':(t.result||t.status||'COMPLETED');
            const gf=m.gf;
            const gfCard=gf?renderInternationalMatchCard(gf,t,archived):'';
            const champion=gf?.status==='done' ? gf.winner : '';
            return `<div class="bg-val-panel border border-val-border rounded-xl p-4 overflow-x-auto">
                <div class="bracket-v2-stage">
                    <section class="bracket-v2-half bracket-v2-upper">
                        <div class="bracket-v2-section-label">UPPER BRACKET <span>(승자조)</span></div>
                        <div class="bracket-v2-cols">
                            ${col('UB ROUND 1',['ub1_0','ub1_1','ub1_2','ub1_3'],'ub-r1')}
                            ${col('UB ROUND 2',['ub2_0','ub2_1'],'ub-r2')}
                            ${col('UB FINAL',['ubf'],'ub-final')}
                            <div class="bracket-v2-empty"></div>
                        </div>
                    </section>
                    <section class="bracket-v2-half bracket-v2-lower">
                        <div class="bracket-v2-section-label">LOWER BRACKET <span>(패자조)</span></div>
                        <div class="bracket-v2-cols">
                            ${col('LB ROUND 1',['lb1_0','lb1_1'],'lb-r1')}
                            ${col('LB ROUND 2',['lb2_0','lb2_1'],'lb-r2')}
                            ${col('LB ROUND 3',['lb3'],'lb-r3')}
                            ${col('LB FINAL',['lbf'],'lb-final')}
                        </div>
                    </section>
                    <aside class="bracket-v2-final">
                        <div class="bracket-v2-section-label final-label">GRAND FINAL</div>
                        <div class="bracket-v2-gf-card">${gfCard || '<div class="text-xs text-val-muted p-4">TBD</div>'}</div>
                        <div class="bracket-v2-champion">
                            <div class="champion-kicker">CHAMPION</div>
                            <div class="champion-name">${champion || 'TBD'}</div>
                            <img src="${trophyImg}" alt="${t.name} trophy">
                            <div class="champion-event">${t.name}</div>
                        </div>
                    </aside>
                </div>
                <div class="mt-4 flex flex-wrap items-center gap-2 text-xs">
                    <span class="px-2.5 py-1 rounded bg-val-dark border border-val-border text-val-muted">${t.year} ${t.name}</span>
                    <span class="px-2.5 py-1 rounded bg-val-dark border border-val-border ${t.status==='active'?'text-green-400':'text-yellow-400'}">${statusLabel}</span>
                    ${t.result?`<span class="px-2.5 py-1 rounded bg-val-red/10 border border-val-red/30 text-val-red">${t.result}</span>`:''}
                </div>
            </div>`;
        }

        function renderInternationalHistoryList() {
            const history=Array.isArray(state.internationalHistory)?state.internationalHistory:[];
            const current=state.internationalTournament;
            const items=[];
            if(current && current.matches){
                items.push(`<button onclick="showInternationalHistory(null)" class="w-full text-left p-3 rounded-lg border ${state.internationalHistoryView===null?'border-val-red bg-val-red/10':'border-val-border bg-val-dark hover:border-val-red/50'}"><div class="flex justify-between gap-3"><div><div class="font-black text-white">${current.year} ${current.name}</div><div class="text-[11px] text-val-muted mt-1">현재 저장된 대회 · ${current.status==='active'?'진행 중':'종료'}</div></div><span class="text-xs font-black ${current.status==='active'?'text-green-400':'text-yellow-400'}">${current.status==='active'?'LIVE':(current.result||'완료')}</span></div></button>`);
            }
            history.forEach((t,i)=>{
                items.push(`<button onclick="showInternationalHistory(${i})" class="w-full text-left p-3 rounded-lg border ${state.internationalHistoryView===i?'border-val-red bg-val-red/10':'border-val-border bg-val-dark hover:border-val-red/50'}"><div class="flex justify-between gap-3"><div><div class="font-black text-white">${t.year} ${t.name}</div><div class="text-[11px] text-val-muted mt-1">${t.teams?.length||0}팀 · 대진표 보관됨</div></div><span class="text-xs font-black text-yellow-400">${t.result||'완료'}</span></div></button>`);
            });
            return items.length?`<div class="bg-val-panel border border-val-border rounded-xl p-4"><div class="flex items-center justify-between mb-3"><div><h3 class="font-black text-white">📚 국제대회 기록</h3><p class="text-[11px] text-val-muted mt-1">현재 대회와 이전 Masters / Champions의 전체 대진표를 다시 볼 수 있습니다.</p></div><span class="text-[10px] text-val-muted">최대 12개 보관</span></div><div class="grid md:grid-cols-2 xl:grid-cols-3 gap-2.5">${items.join('')}</div></div>`:'';
        }

        function renderInternationalView() {
            if (state && state.tier === 2) {
                return `<div class="bg-val-panel border border-val-border rounded-xl p-8 text-center">
                    <div class="text-5xl mb-4">🔒</div>
                    <div class="text-xs font-black text-val-accent tracking-widest">CHALLENGERS ONLY</div>
                    <h2 class="text-2xl font-black text-white mt-2">2부 팀은 국제대회에 참가할 수 없습니다</h2>
                    <p class="text-sm text-val-muted mt-2 max-w-xl mx-auto leading-relaxed">Challengers 팀의 국제대회(Masters / Champions) 출전은 잠겨 있습니다.<br>대신 시즌 후반 <b class="text-white">Challengers Ascension</b>에서 1부 VCT 승격 기회를 얻을 수 있습니다.</p>
                    <div class="grid sm:grid-cols-3 gap-3 max-w-2xl mx-auto mt-6 text-left">
                        <div class="bg-val-dark border border-val-border rounded-lg p-4"><div class="text-[10px] text-val-muted">국제대회</div><div class="font-black text-val-red mt-1">참가 불가</div></div>
                        <div class="bg-val-dark border border-val-border rounded-lg p-4"><div class="text-[10px] text-val-muted">승격 대회</div><div class="font-black text-val-accent mt-1">Ascension</div></div>
                        <div class="bg-val-dark border border-val-border rounded-lg p-4"><div class="text-[10px] text-val-muted">승격 보상</div><div class="font-black text-green-400 mt-1">다음 시즌 1부</div></div>
                    </div>
                </div>`;
            }
            const phase=getPhaseName(state.week), isIntl=['masters1','masters2','champions'].includes(phase.type);
            const history=Array.isArray(state.internationalHistory)?state.internationalHistory:[];
            let selected=null, selectedArchived=false;
            if(Number.isInteger(state.internationalHistoryView)) {
                selected=history[state.internationalHistoryView] || null;
                selectedArchived=!!selected;
            }
            if(!selected) {
                if(isIntl) selected=ensureInternationalTournament(phase.type);
                else selected=state.internationalTournament;
            }
            if(!selected || !selected.matches) {
                return `<div class="flex flex-col gap-5">${renderInternationalHistoryList()}<div class="intl-hero"><div class="text-xs font-black text-val-red tracking-widest">INTERNATIONAL TOURNAMENT</div><h2 class="text-3xl font-black text-white mt-2">국제대회 기록이 없습니다</h2><p class="text-sm text-val-muted mt-2">국제대회에 진출하면 이곳에 대진표가 자동으로 보관됩니다.</p></div></div>`;
            }
            const t=selected;
            const trophyImg=t.type==='champions'?TROPHY_IMAGES.champions:TROPHY_IMAGES.masters;
            const current = !selectedArchived && t.playerMatchId ? t.matches[t.playerMatchId] : null;
            return `<div class="flex flex-col gap-5">
                ${renderInternationalHistoryList()}
                <div class="intl-event-rail">
                    <div class="intl-event-item ${t.type==='masters1'?'active':''}"><div class="event-mark">✦</div><div><b>MASTERS 1</b><span>INTERNATIONAL</span></div><em>${t.type==='masters1'?'선택됨':'기록'}</em></div>
                    <div class="intl-event-item ${t.type==='masters2'?'active':''}"><div class="event-mark">✦</div><div><b>MASTERS 2</b><span>INTERNATIONAL</span></div><em>${t.type==='masters2'?'선택됨':'기록'}</em></div>
                    <div class="intl-event-item ${t.type==='champions'?'active':''}"><div class="event-mark">✦</div><div><b>CHAMPIONS</b><span>INTERNATIONAL</span></div><em>${t.type==='champions'?'선택됨':'기록'}</em></div>
                </div>
                <div class="intl-hero"><div class="flex flex-col md:flex-row md:items-center justify-between gap-4 relative z-10"><div><div class="text-xs font-black text-val-red tracking-widest">${t.type==='champions'?'VALORANT CHAMPIONS':'VALORANT MASTERS'}</div><h2 class="text-3xl font-black text-white mt-1">${t.name} · ${t.year}</h2><p class="text-sm text-val-muted mt-1">8팀 더블 엘리미네이션 · 승자조 / 패자조 / 그랜드 파이널</p></div><div class="flex items-center gap-4"><img src="${trophyImg}" class="w-20 h-28 object-contain" alt="${t.name} trophy"><div><div class="text-xs text-val-muted">상태</div><div class="text-xl font-black ${t.status==='active'?'text-green-400':'text-yellow-400'}">${t.status==='active'?'TOURNAMENT LIVE':t.result||t.status}</div></div></div></div></div>
                ${renderInternationalBracket(t,selectedArchived)}
                ${current?`<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 bg-val-panel border border-val-border rounded-xl p-5"><div class="flex justify-between items-center"><div><div class="text-xs text-val-muted">NEXT MATCH</div><h3 class="text-xl font-black text-white mt-1">${current.round}</h3></div><span class="text-xs font-black bg-val-red/20 text-val-red border border-val-red/40 px-3 py-1.5 rounded-lg">${state.myTeamName}</span></div><div class="mt-4">${renderInternationalMatchCard(current,t,false)}</div><button onclick="playMatch()" class="w-full mt-4 bg-val-red hover:bg-val-redHover text-white font-black py-3 rounded-lg">⚔️ 이 경기 진행 (BO3)</button></div><div class="trophy-card-large flex flex-col items-center justify-center"><div class="text-xs font-black text-yellow-400 tracking-widest">CHAMPIONSHIP TROPHY</div><img src="${trophyImg}" class="trophy-img mt-2" alt="tournament trophy"><div class="font-black text-white">${t.name}</div><div class="text-xs text-val-muted mt-1">우승 시 트로피 진열장에 추가</div></div></div>`:`<div class="bg-val-panel border border-val-border rounded-xl p-5 text-center"><div class="text-2xl mb-2">${t.status==='active'?'⏳':'🏆'}</div><div class="font-black text-white">${t.status==='active'?'현재 진행 가능한 내 경기가 없습니다.':'대회가 종료된 기록입니다.'}</div><div class="text-xs text-val-muted mt-1">위 브래킷에서 전체 경기 결과와 대진을 확인할 수 있습니다.</div></div>`}
            </div>`;
        }

        function resetInternationalTournament(type) {
            if (!state || !['masters1','masters2','champions'].includes(type)) return;
            if (state.internationalTournament) archiveInternationalTournament(state.internationalTournament);
            state.internationalTournament = null;
            state.internationalPhaseType = type;
            state.internationalMatchesPlayed = 0;
            state.internationalMatchTarget = 0;
            const t = ensureInternationalTournament(type);
            if (t) showToast(`${t.name} 대회를 다시 준비했습니다.`);
            renderApp();
        }

        function renderWorldRankingView() {
            const rankings = getWorldRankingTeams();
            const rows = rankings.map((t, i) => `
                <tr class="${t.isMe ? 'bg-val-red/15 border-l-4 border-val-red' : 'border-b border-val-border/50'} hover:bg-val-border/30 transition text-sm">
                    <td class="py-3 px-4 font-black ${i < 3 ? 'text-yellow-400' : 'text-gray-300'}">${i+1}</td>
                    <td class="py-3 px-4 font-bold text-white flex items-center gap-2.5">${renderTeamLogo(t, 'w-8 h-8 text-xs')}<span>${t.name}</span>${t.isMe ? '<span class="text-[10px] bg-val-red text-white font-bold px-1.5 py-0.5 rounded">MY TEAM</span>' : ''}</td>
                    <td class="py-3 px-4 text-xs text-val-muted">${t.regionName}</td>
                    <td class="py-3 px-4 text-center font-black text-val-accent">${t.score}</td>
                    <td class="py-3 px-4 text-center font-bold">${t.power}</td>
                    <td class="py-3 px-4 text-center"><span class="text-green-400 font-bold">${t.w}</span> - <span class="text-val-red font-bold">${t.l}</span></td>
                </tr>`).join('');
            return `<div class="bg-val-panel border border-val-border rounded-xl p-5">
                <div class="border-b border-val-border pb-3 mb-4"><h2 class="text-lg font-black text-white">🌐 세계순위</h2><p class="text-xs text-val-muted mt-1">게임 내 Tier 1 팀의 전력·성적·국제대회 우승을 반영한 동적 순위입니다.</p></div>
                <div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="text-xs text-val-muted bg-val-dark uppercase border-b border-val-border"><th class="py-2.5 px-4">Rank</th><th class="py-2.5 px-4">Team</th><th class="py-2.5 px-4">Region</th><th class="py-2.5 px-4 text-center">World Score</th><th class="py-2.5 px-4 text-center">Power</th><th class="py-2.5 px-4 text-center">W / L</th></tr></thead><tbody>${rows}</tbody></table></div>
            </div>`;
        }

        function renderTrophyCabinetView() {
            const trophies=state.trophies||[];
            const cards=trophies.length?trophies.map(t=>{const image=t.image||(t.name==='Champions'?TROPHY_IMAGES.champions:TROPHY_IMAGES.masters);return `<div class="trophy-card-large hover:border-yellow-400 transition"><div class="text-[10px] font-black tracking-widest text-yellow-400 uppercase">${t.result||'CHAMPION'}</div><img class="trophy-img mt-2" src="${image}" alt="${t.name} trophy"><div class="text-lg font-black text-white text-center">${t.name}</div><div class="text-xs text-yellow-400 font-bold mt-1 text-center">${t.year} · CHAMPION</div><div class="text-xs text-val-muted mt-2 text-center">${t.description||'국제대회 우승 트로피'}</div></div>`}).join(''):`<div class="col-span-full bg-val-dark border border-val-border rounded-xl p-10 text-center"><div class="text-6xl mb-3">🏆</div><div class="font-black text-white">아직 획득한 트로피가 없습니다.</div><div class="text-xs text-val-muted mt-2">Masters 또는 Champions 그랜드 파이널에서 우승하면 실제 트로피 이미지가 진열됩니다.</div></div>`;
            return `<div class="bg-val-panel border border-val-border rounded-xl p-5"><div class="flex justify-between items-center border-b border-val-border pb-3 mb-5"><div><h2 class="text-lg font-black text-white">🏆 트로피 진열장</h2><p class="text-xs text-val-muted mt-1">실제 트로피 이미지로 커리어 우승 기록을 전시합니다.</p></div><div class="text-2xl font-black text-yellow-400">${trophies.length}</div></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div></div>`;
        }

        function renderStatsView() {
            if (!state || !state.players) return '';

            const sortedPlayers = [...state.players].sort((a, b) => {
                const avgAcsA = a.stats.matches > 0 ? a.stats.acsSum / a.stats.matches : 0;
                const avgAcsB = b.stats.matches > 0 ? b.stats.acsSum / b.stats.matches : 0;
                return avgAcsB - avgAcsA;
            });

            const statRows = sortedPlayers.map((p, idx) => {
                const rConf = getRoleConfig(p.role);
                const matches = p.stats.matches;
                const avgAcs = matches > 0 ? Math.round(p.stats.acsSum / matches) : 0;
                const kd = p.stats.deaths > 0 ? (p.stats.kills / p.stats.deaths).toFixed(2) : p.stats.kills;

                return `
                    <tr class="border-b border-val-border/40 hover:bg-val-border/30 transition text-sm">
                        <td class="py-3 px-4 font-bold ${idx === 0 ? 'text-yellow-400' : 'text-gray-300'}">${idx + 1}</td>
                        <td class="py-3 px-4 font-bold text-white flex items-center gap-2">
                            <span>${p.name}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded font-bold bg-val-panel border border-val-border ${rConf.color}">${p.role}</span>
                        </td>
                        <td class="py-3 px-4 text-center font-bold text-val-gold">${p.agent}</td>
                        <td class="py-3 px-4 text-center font-bold text-white">${matches}</td>
                        <td class="py-3 px-4 text-center font-black text-val-accent">${avgAcs}</td>
                        <td class="py-3 px-4 text-center font-bold text-gray-200">${p.stats.kills} / ${p.stats.deaths} / ${p.stats.assists}</td>
                        <td class="py-3 px-4 text-center font-bold ${kd >= 1.2 ? 'text-green-400' : kd < 0.9 ? 'text-val-red' : 'text-white'}">${kd}</td>
                        <td class="py-3 px-4 text-center font-bold text-yellow-400">${p.stats.mvpCount > 0 ? '⭐ ' + p.stats.mvpCount : '-'}</td>
                    </tr>
                `;
            }).join("");

            return `
                <div class="bg-val-panel border border-val-border rounded-xl p-5">
                    <div class="flex justify-between items-center border-b border-val-border pb-3 mb-4">
                        <div>
                            <h2 class="text-lg font-bold text-white">${state.year} 시즌 누적 선수 통계</h2>
                            <p class="text-xs text-val-muted">현재 로스터 선수의 경기별 누적 기록입니다.</p>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-xs text-val-muted bg-val-dark uppercase border-b border-val-border">
                                    <th class="py-2.5 px-4">순위</th>
                                    <th class="py-2.5 px-4">선수명</th>
                                    <th class="py-2.5 px-4 text-center">선호 요원</th>
                                    <th class="py-2.5 px-4 text-center">출전 수</th>
                                    <th class="py-2.5 px-4 text-center">평균 ACS</th>
                                    <th class="py-2.5 px-4 text-center">총 K / D / A</th>
                                    <th class="py-2.5 px-4 text-center">K/D</th>
                                    <th class="py-2.5 px-4 text-center">MVP</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${statRows.length > 0 ? statRows : '<tr><td colspan="8" class="text-center py-6 text-val-muted text-sm">출전 기록이 있는 선수가 없습니다.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderMatchReportView() {
            const history = Array.isArray(state.matchHistory) ? state.matchHistory.slice(-10).reverse() : [];
            const fallback = state.lastMatchReport ? [state.lastMatchReport] : [];
            const reports = history.length ? history : fallback;

            if (!reports.length) {
                return `
                    <div class="bg-val-panel border border-val-border rounded-xl p-8 text-center">
                        <i class="fa-solid fa-clipboard-question text-4xl text-val-border mb-3"></i>
                        <h3 class="text-base font-bold text-white">경기 기록이 없습니다.</h3>
                        <p class="text-xs text-val-muted mt-1">경기를 진행하면 최근 최대 10경기의 선수 상세 스탯이 여기에 저장됩니다.</p>
                    </div>
                `;
            }

            const renderReport = (report, idx) => {
                const mapBoxes = (report.maps || []).map(m => `
                    <div class="bg-val-dark p-3 rounded-lg border border-val-border flex justify-between items-center">
                        <div>
                            <div class="text-[10px] text-val-muted font-bold">MAP ${m.mapIndex}</div>
                            <div class="text-sm font-bold text-white">${m.mapName}</div>
                        </div>
                        <div class="text-base font-black ${m.myScore > m.oppScore ? 'text-green-400' : 'text-val-red'}">${m.myScore} - ${m.oppScore}</div>
                    </div>
                `).join('');
                const rows = (report.playerStats || []).map(p => `
                    <tr class="border-b border-val-border/40 text-xs">
                        <td class="py-2.5 px-2.5 font-bold text-white whitespace-nowrap">${p.isMvp ? '⭐ ' : ''}${p.name}</td>
                        <td class="py-2.5 px-2.5 text-val-muted">${p.role || '-'}</td>
                        <td class="py-2.5 px-2.5 text-val-muted">${p.agent}</td>
                        <td class="py-2.5 px-2.5 text-center font-black text-val-accent">${p.acs}</td>
                        <td class="py-2.5 px-2.5 text-center">${p.adr ?? '-'}</td>
                        <td class="py-2.5 px-2.5 text-center">${p.kast != null ? p.kast + '%' : '-'}</td>
                        <td class="py-2.5 px-2.5 text-center font-semibold">${p.kills} / ${p.deaths} / ${p.assists}</td>
                        <td class="py-2.5 px-2.5 text-center font-bold">${p.kd}</td>
                        <td class="py-2.5 px-2.5 text-center">${p.firstKills ?? '-'} / ${p.firstDeaths ?? '-'}</td>
                    </tr>
                `).join('');
                return `
                    <details class="match-history-item bg-val-panel border border-val-border rounded-xl overflow-hidden" ${idx === 0 ? 'open' : ''}>
                        <summary class="list-none cursor-pointer px-4 py-3.5 flex items-center justify-between gap-4 hover:bg-white/[.02]">
                            <div class="min-w-0 flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg ${report.isWin ? 'bg-green-500/10 text-green-400 border-green-500/20' : 'bg-val-red/10 text-val-red border-val-red/20'} border flex items-center justify-center font-black text-xs">${report.isWin ? 'W' : 'L'}</div>
                                <div class="min-w-0">
                                    <div class="text-sm font-black text-white truncate">${state.myTeamName} <span class="text-val-muted font-normal">vs</span> ${report.oppName}</div>
                                    <div class="text-[10px] text-val-muted mt-0.5">${report.year || state.year} 시즌 · ${report.week || '-'}주차 · ${report.phase || '경기'}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-3 shrink-0">
                                <span class="text-lg font-black ${report.isWin ? 'text-green-400' : 'text-val-red'}">${report.myMapsWon} : ${report.oppMapsWon}</span>
                                <span class="text-[10px] text-val-muted">▼</span>
                            </div>
                        </summary>
                        <div class="border-t border-val-border p-4 flex flex-col gap-4">
                            <div class="grid sm:grid-cols-3 gap-2.5">${mapBoxes}</div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse min-w-[760px]">
                                    <thead>
                                        <tr class="text-[10px] text-val-muted uppercase border-b border-val-border bg-val-dark">
                                            <th class="py-2.5 px-2.5">선수</th><th class="py-2.5 px-2.5">역할</th><th class="py-2.5 px-2.5">요원</th>
                                            <th class="py-2.5 px-2.5 text-center">ACS</th><th class="py-2.5 px-2.5 text-center">ADR</th><th class="py-2.5 px-2.5 text-center">KAST</th>
                                            <th class="py-2.5 px-2.5 text-center">K / D / A</th><th class="py-2.5 px-2.5 text-center">K/D</th><th class="py-2.5 px-2.5 text-center">FK / FD</th>
                                        </tr>
                                    </thead>
                                    <tbody>${rows}</tbody>
                                </table>
                            </div>
                        </div>
                    </details>
                `;
            };

            return `
                <div class="flex flex-col gap-4">
                    <div class="bg-val-panel border border-val-border rounded-xl p-5 flex items-center justify-between gap-4">
                        <div>
                            <div class="text-xs font-black text-val-red uppercase tracking-wider">Match Center</div>
                            <h2 class="text-xl font-black text-white mt-1">최근 경기 선수 스탯</h2>
                            <p class="text-xs text-val-muted mt-1">경기별로 펼쳐서 선수 5명의 ACS · ADR · KAST · K/D/A · 첫 킬/첫 데스를 확인할 수 있어.</p>
                        </div>
                        <div class="shrink-0 text-right">
                            <div class="text-2xl font-black text-white">${reports.length}<span class="text-sm text-val-muted"> / 10</span></div>
                            <div class="text-[10px] text-val-muted">보관 경기</div>
                        </div>
                    </div>
                    ${reports.map(renderReport).join('')}
                </div>
            `;
        }

        function openStartModal(regionKey) {
            const reg = VCT_DATA[regionKey];
            const modalHTML = `
                <div class="flex flex-col gap-5">
                    <div>
                        <h2 class="text-xl font-black text-white">${reg.name} 디비전 선택</h2>
                        <p class="text-xs text-val-muted mt-1">2026-2030 VCT 또는 Challengers 디비전을 선택하세요.</p>
                    </div>

                    <div class="grid sm:grid-cols-2 gap-4">
                        <div class="bg-val-dark border-2 border-val-red p-4 rounded-xl cursor-pointer hover:bg-val-border/40 transition" onclick="selectTierAndShowTeams('${regionKey}', 1)">
                            <div class="text-xs font-bold text-val-red">TIER 1 DIVISION</div>
                            <h3 class="text-lg font-black text-white mt-1">1부 VCT League</h3>
                            <p class="text-xs text-val-muted mt-2">최상위 글로벌 리그 (${reg.t1.length}개 구단 선택 가능)</p>
                        </div>
                        <div class="bg-val-dark border-2 border-val-accent p-4 rounded-xl cursor-pointer hover:bg-val-border/40 transition" onclick="selectTierAndShowTeams('${regionKey}', 2)">
                            <div class="text-xs font-bold text-val-accent">TIER 2 DIVISION</div>
                            <h3 class="text-lg font-black text-white mt-1">2부 Challengers League</h3>
                            <p class="text-xs text-val-muted mt-2">도전자의 길 (${reg.t2.length}개 구단 선택 가능)</p>
                        </div>
                    </div>

                    <button class="bg-val-border hover:bg-gray-700 text-white font-bold py-2 rounded-lg text-xs" onclick="closeModal()">취소</button>
                </div>
            `;
            openModal(modalHTML);
        }

        function selectTierAndShowTeams(regionKey, tier) {
            const reg = VCT_DATA[regionKey];
            const teams = tier === 1 ? reg.t1 : reg.t2;

            const teamCards = teams.map((team, idx) => {
                const rosterPreview = team.roster.map((p, pidx) => {
                    const isSixth = p.isSixth || pidx >= 5;
                    const roleKo = p.role;
                    return `<div class="roster-player ${isSixth ? 'sixth-player' : ''}">
                        <span class="player-name">${p.name}</span>
                        <span class="player-role">${roleKo}</span>
                        ${isSixth ? '<span class="player-sixth">6TH</span>' : ''}
                    </div>`;
                }).join("");
                return `
                <div class="team-card-mobile flex flex-col justify-between">
                    <div class="flex items-center gap-3 min-w-0">
                        ${renderTeamLogo(team, "w-10 h-10 text-sm")}
                        <div class="min-w-0">
                            <div class="team-name font-black text-white">${team.name}</div>
                            <div class="team-power font-bold">팀 전력 ${team.power}</div>
                        </div>
                    </div>
                    <div class="roster-mobile">
                        ${rosterPreview}
                    </div>
                    <button class="take-team-btn w-full bg-val-red hover:bg-val-redHover text-white font-bold shadow transition" 
                            onclick='selectTeamForCareer("${regionKey}", ${tier}, ${idx})'>
                        ${team.name} 감독으로 부임하기
                    </button>
                </div>
                `;
            }).join("");

            const modalHTML = `
                <div class="flex flex-col gap-4 max-h-[80vh]">
                    <div>
                        <h2 class="text-xl font-black text-white">${reg.name} (${tier === 1 ? '1부 VCT' : '2부 Challengers'}) 구단 선택</h2>
                        <p class="text-xs text-val-muted mt-1">감독으로 부임할 구단을 선택하십시오.</p>
                    </div>

                    <div class="team-list-mobile">
                        ${teamCards}
                    </div>

                    <button class="team-back-btn w-full bg-val-border hover:bg-gray-700 text-white font-bold py-2 rounded-lg mt-2" onclick="openStartModal('${regionKey}')">뒤로 가기</button>
                </div>
            `;
            openModal(modalHTML);
        }

        function awardInternationalTrophy(phase, finalWin) {
            if (!state || !finalWin) return;
            const trophyName = phase.type === 'masters1' ? 'Masters 1' : phase.type === 'masters2' ? 'Masters 2' : 'Champions';
            if ((state.trophies || []).some(t => t.year === state.year && t.name === trophyName)) return;
            if (!state.trophies) state.trophies = [];
            const image = phase.type === 'champions' ? TROPHY_IMAGES.champions : TROPHY_IMAGES.masters;
            state.trophies.push({name:trophyName,year:state.year,result:'CHAMPION',image,description:`${state.year} ${phase.name} 더블 엘리미네이션 우승`});
            state.reputation=Math.min(100,state.reputation+(phase.type==='champions'?10:6)); state.fan=Math.min(100,state.fan+(phase.type==='champions'?12:7)); state.internationalWins=(state.internationalWins||0)+1;
            state.logs.push(`🏆 [${state.year} ${phase.name}] ${state.myTeamName} 우승! 트로피 진열장에 ${trophyName} 트로피가 추가되었습니다.`); showToast(`🏆 ${trophyName} CHAMPION! 트로피 획득!`);
        }

        function playMatch() {
            if (!careerActionAllowed()) return;
            if (getStartingPlayers().length < 5) {
                showToast("선발 5명이 필요합니다. 로스터에서 식스맨을 교체해 주세요.");
                navigate('market');
                return;
            }
            if (state.week > 20) {
                showToast("모든 시즌 일정이 종료되었습니다.");
                return;
            }

            const phase = getPhaseName(state.week);
            if (phase.type === 'offseason') {
                showToast("오프시즌 기간입니다. 차기 시즌으로 진입해주세요.");
                return;
            }

            const isInternational = phase.type === 'masters1' || phase.type === 'masters2' || phase.type === 'champions';
            const isAscension = phase.type === 'ascension' && state.tier === 2;
            const isQualified = checkTop4Qualification();

            if (isInternational && state.tier === 2) {
                showToast("2부 팀은 Masters / Champions에 참가할 수 없습니다.");
                return;
            }

            if (isAscension) {
                if (state.week === 18) {
                    if (!isQualified) {
                        state.ascensionStage = 0;
                        state.logs.push(`⚠️ [${state.year} Ascension] 리그 상위권에 들지 못해 승격 대회에 참가하지 못했습니다.`);
                        showToast("어센션 진출 실패 — 다음 시즌을 준비하세요.");
                        advanceWeek(true);
                        return;
                    }
                    state.ascensionStage = 1;
                } else if (state.week === 19 && state.ascensionStage !== 2) {
                    if (state.ascensionStage === 3) {
                        showToast("어센션 탈락 — 오프시즌으로 이동합니다.");
                        advanceWeek(true);
                        return;
                    }
                    if (state.ascensionStage === 4) {
                        showToast("이미 1부 VCT 승격을 확정했습니다.");
                        advanceWeek(true);
                        return;
                    }
                    showToast("어센션 결승에 진출하지 못했습니다.");
                    advanceWeek(true);
                    return;
                }
            }

            if (isInternational && !isQualified) {
                showToast("상위 4위 안에 들지 못해 국제대회 진출이 좌절되었습니다. 이번 주는 시뮬레이션으로 넘어갑니다.");
                state.logs.push(`⚠️ [${state.year} ${phase.name}] 상위 4위 진입 실패로 인해 국제대회에 참가하지 못하고 휴식을 가졌습니다.`);
                advanceWeek(true);
                return;
            }

            if (isInternational) ensureInternationalTournament(phase.type);

            const currentTeams = state.tier === 1 ? state.t1Teams : state.t2Teams;
            const myTeamRef = currentTeams.find(t => t.name === state.myTeamName);
            const opp = isInternational ? getInternationalOpponent() : currentTeams.filter(t => t.name !== state.myTeamName)[Math.floor(Math.random() * Math.max(1, currentTeams.length - 1))];

            if (!opp) {
                showToast("경기 상대를 찾지 못했습니다.");
                return;
            }

            if (!isInternational) {
                simulateCpuMatches(opp.name);
            }

            let myMapsWon = 0;
            let oppMapsWon = 0;
            let playedMaps = [];
            const shuffledMaps = [...MAP_POOL].sort(() => Math.random() - 0.5);

            for (let i = 0; i < 3; i++) {
                if (myMapsWon === 2 || oppMapsWon === 2) break;

                const myPower = calculateTeamPower();
                const baseOppPower = isInternational ? (opp.power + 4 + (state.year - 2026) * 1) : opp.power;
                const oppPower = baseOppPower * (1 + getDifficultyConfig().opp);

                const powerDiff = myPower - oppPower;
                const winProbability = 1 / (1 + Math.pow(10, -powerDiff / 25));
                const randomRoll = Math.random();

                let myRounds = 0;
                let oppRounds = 0;

                if (randomRoll < winProbability) {
                    myRounds = 13;
                    oppRounds = Math.max(3, Math.floor(13 - (winProbability * 10) - (Math.random() * 5)));
                    if (oppRounds >= 13) oppRounds = 12;
                    myMapsWon++;
                } else {
                    oppRounds = 13;
                    myRounds = Math.max(3, Math.floor(13 - ((1 - winProbability) * 10) - (Math.random() * 5)));
                    if (myRounds >= 13) myRounds = 12;
                    oppMapsWon++;
                }

                playedMaps.push({
                    mapIndex: i + 1,
                    mapName: shuffledMaps[i],
                    myScore: myRounds,
                    oppScore: oppRounds
                });
            }

            const isWin = myMapsWon > oppMapsWon;

            let matchPlayerStats = [];
            let highestAcs = -1;
            let mvpIndex = 0;

            // 실제 VCT 한 시리즈 기준에 맞춘 선수 스탯 생성.
            // 2-0/2-1에 따라 총 라운드 수가 달라지고, 역할/OVR이 KPR·APR·ACS에 함께 영향을 줌.
            const totalRounds = playedMaps.reduce((sum, m) => sum + m.myScore + m.oppScore, 0);
            const roleProfile = {
                Duelist:   { kpr: 0.76, apr: 0.20, acs: 18, adr: 14, kast: 0.00 },
                Initiator: { kpr: 0.67, apr: 0.34, acs:  4, adr:  3, kast: 0.02 },
                Controller:{ kpr: 0.60, apr: 0.38, acs: -2, adr: -1, kast: 0.02 },
                Sentinel:  { kpr: 0.62, apr: 0.35, acs:  1, adr:  1, kast: 0.02 },
                Flex:      { kpr: 0.68, apr: 0.32, acs:  6, adr:  5, kast: 0.01 }
            };

            getStartingPlayers().forEach((p, idx) => {
                const prof = roleProfile[p.role] || roleProfile.Flex;
                const skill = Math.max(-0.10, Math.min(0.10, (p.ovr - 85) * 0.012));
                const formNoise = (Math.random() - 0.5) * 0.12;
                const kpr = Math.max(0.45, prof.kpr + skill + formNoise);
                const apr = Math.max(0.15, prof.apr + (Math.random() - 0.5) * 0.10);
                const dpr = Math.max(0.50, 0.74 - skill + (Math.random() - 0.5) * 0.10);

                const kills = Math.max(15, Math.round(totalRounds * kpr));
                const deaths = Math.max(14, Math.round(totalRounds * dpr));
                const assists = Math.max(5, Math.round(totalRounds * apr));

                // ACS/ADR는 킬 수에만 비례하지 않고 역할과 OVR에 따라 움직이게 함.
                const acs = Math.max(120, Math.min(320,
                    Math.round(165 + (p.ovr - 80) * 2.8 + prof.acs + (Math.random() - 0.5) * 28)
                ));
                const adr = Math.max(85, Math.min(180,
                    Math.round(108 + (p.ovr - 80) * 2.2 + prof.adr + (Math.random() - 0.5) * 14)
                ));
                const kast = Math.max(58, Math.min(86,
                    Math.round(70 + (p.ovr - 80) * 0.55 + prof.kast * 100 + (Math.random() - 0.5) * 8)
                ));
                const fkpr = Math.max(0.03, (prof.kpr * 0.13) + (p.role === 'Duelist' ? 0.025 : 0) + (Math.random() - 0.5) * 0.025);
                const fdpr = Math.max(0.03, 0.075 - skill * 0.04 + (Math.random() - 0.5) * 0.015);
                const firstKills = Math.max(1, Math.round(totalRounds * fkpr));
                const firstDeaths = Math.max(1, Math.round(totalRounds * fdpr));

                if (acs > highestAcs) {
                    highestAcs = acs;
                    mvpIndex = idx;
                }

                matchPlayerStats.push({
                    name: p.name,
                    agent: p.agent,
                    role: p.role,
                    kills,
                    deaths,
                    assists,
                    acs,
                    adr,
                    kast,
                    firstKills,
                    firstDeaths,
                    kd: deaths > 0 ? (kills / deaths).toFixed(2) : kills,
                    isMvp: false
                });

                p.stats.matches++;
                p.stats.kills += kills;
                p.stats.deaths += deaths;
                p.stats.assists += assists;
                p.stats.acsSum += acs;
            });

            matchPlayerStats[mvpIndex].isMvp = true;
            getStartingPlayers()[mvpIndex].stats.mvpCount++;

            if (!isInternational) {
                if (isWin) {
                    myTeamRef.w++;
                    opp.l++;
                } else {
                    myTeamRef.l++;
                    opp.w++;
                }
            }

            if (isWin) {
                state.form = Math.min(100, state.form + 3);
                state.morale = Math.min(100, state.morale + 4);
                state.fan = Math.min(100, state.fan + 3);
                state.reputation = Math.min(100, state.reputation + 2);
                state.logs.push(`🟩 [${state.year} ${phase.name}] 승리 (2-${oppMapsWon}) — ${opp.name} 구단을 상대로 승리했습니다!`);
                showToast(`${phase.name} 경기 승리! 🎉`);
            } else {
                state.form = Math.max(0, state.form - 2);
                state.morale = Math.max(0, state.morale - (state.difficulty === "champion" ? 4 : 2));
                state.logs.push(`🟥 [${state.year} ${phase.name}] 패배 (${myMapsWon}-2) — ${opp.name}에게 아쉽게 패배했습니다.`);
                showToast(`${phase.name} 경기 패배...`);
            }

            let prize = isWin ? (state.tier === 1 ? 35000 : 18000) : (state.tier === 1 ? 14000 : 7000);
            if (phase.type === 'masters1' || phase.type === 'masters2') prize *= 2.0;
            if (phase.type === 'champions') prize *= 4.0;
            state.cash += Math.round(prize * getDifficultyConfig().prize);
            if (checkBankruptcy()) {
                renderApp();
                return;
            }

            state.lastMatchReport = {
                id: `match_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
                year: state.year,
                week: state.week,
                phase: phase.name,
                oppName: opp.name,
                myMapsWon: myMapsWon,
                oppMapsWon: oppMapsWon,
                isWin: isWin,
                maps: playedMaps,
                playerStats: matchPlayerStats.map(p => ({...p}))
            };
            if (!Array.isArray(state.matchHistory)) state.matchHistory = [];
            state.matchHistory.push(state.lastMatchReport);
            if (state.matchHistory.length > 10) state.matchHistory = state.matchHistory.slice(-10);

            // 경기 직후 SNS 반응을 생성해 대시보드에 실시간처럼 표시
            addSNSReactions(generateSNSReactions(isWin, opp.name, myMapsWon, oppMapsWon, matchPlayerStats));

            if (isAscension) {
                if (state.week === 18) {
                    if (isWin) {
                        state.ascensionStage = 2;
                        state.logs.push(`🟩 [${state.year} Ascension] 준결승 승리 — 1부 승격을 향한 결승에 진출했습니다!`);
                        showToast("어센션 결승 진출! 🏆");
                    } else {
                        state.ascensionStage = 3;
                        state.logs.push(`🟥 [${state.year} Ascension] 준결승 패배 — 승격 기회를 놓쳤습니다.`);
                        showToast("어센션 탈락...");
                    }
                } else if (state.week === 19) {
                    if (isWin) {
                        state.ascensionStage = 4;
                        state.pendingPromotion = true;
                        state.promotionSeason = state.year + 1;
                        state.reputation = Math.min(100, state.reputation + 8);
                        state.fan = Math.min(100, state.fan + 10);
                        state.logs.push(`🏆 [${state.year} Ascension] 우승! ${state.year + 1} 시즌 1부 VCT 승격을 확정했습니다.`);
                        showToast("어센션 우승! 다음 시즌 1부 VCT 승격 🎉");
                    } else {
                        state.ascensionStage = 3;
                        state.logs.push(`🟥 [${state.year} Ascension] 결승 패배 — 다음 시즌에도 2부에서 도전합니다.`);
                        showToast("어센션 준우승 — 2부 잔류");
                    }
                }
            }

            if (isInternational) {
                const tournament=state.internationalTournament; const match=tournament?.matches?.[tournament.playerMatchId];
                if (match) { match.status='done'; match.winner=isWin?state.myTeamName:opp.name; match.loser=isWin?opp.name:state.myTeamName; match.scoreA=match.a===state.myTeamName?myMapsWon:oppMapsWon; match.scoreB=match.a===state.myTeamName?oppMapsWon:myMapsWon; }
                state.internationalMatchesPlayed++;
                const isGrandFinal=match?.id==='gf';
                const isEliminated=!isWin && ['lb1_0','lb1_1','lb2_0','lb2_1','lb3','lbf'].includes(match?.id);
                if (isGrandFinal && isWin) {
                    tournament.status='champion'; tournament.result='CHAMPION'; archiveInternationalTournament(tournament); state.logs.push(`🏆 [${state.year} ${phase.name}] ${state.myTeamName}가 그랜드 파이널에서 우승했습니다!`); awardInternationalTrophy(phase,true);
                    state.internationalPhaseType=null; state.internationalMatchTarget=0; state.internationalMatchesPlayed=0; renderApp(); advanceWeek(true); return;
                }
                if (isGrandFinal && !isWin) {
                    tournament.status='runnerup'; tournament.result='RUNNER-UP'; archiveInternationalTournament(tournament); state.logs.push(`🥈 [${state.year} ${phase.name}] ${state.myTeamName}가 그랜드 파이널 준우승을 기록했습니다.`);
                    state.internationalPhaseType=null; state.internationalMatchTarget=0; state.internationalMatchesPlayed=0; renderApp(); advanceWeek(true); return;
                }
                if (isEliminated) {
                    tournament.status='eliminated'; tournament.result='ELIMINATED'; archiveInternationalTournament(tournament); state.logs.push(`🟥 [${state.year} ${phase.name}] ${state.myTeamName} 패자조에서 탈락했습니다.`);
                    state.internationalPhaseType=null; state.internationalMatchTarget=0; state.internationalMatchesPlayed=0; renderApp(); advanceWeek(true); return;
                }
                intlPrepareNextPlayerMatch(true); renderApp(); return;
            }

            if (state.week >= 17 && state.week <= 19) maybeGenerateCoachOffer(false);
            advanceWeek(true);
        }

        function advanceWeek(fromMatch = false) {
            if (!careerActionAllowed()) return;
            if (state.week >= 20 && !fromMatch) {
                if (state.year >= 2030) {
                    openModal(`
                        <div class="text-center flex flex-col gap-4">
                            <div class="text-5xl">🏆</div>
                            <h2 class="text-2xl font-black text-white">2030년 챔피언십 대장정 완료</h2>
                            <p class="text-sm text-val-muted">2026년부터 2030년까지 5년간의 감독 커리어가 명예롭게 마무리되었습니다!</p>
                            <button class="bg-val-red text-white font-bold py-2.5 rounded-xl mt-2" onclick="location.reload()">새 게임 시작하기</button>
                        </div>
                    `);
                    return;
                } else {
                    if (evaluateCoachJobSecurity()) {
                        state.year++; state.week = 1; state.trainingDone = false; state.sponsorDealsUsed = 0; state.sponsorDealsMax = 2;
                    // 계약이 끝났는데 새 제의를 받지 못했다면 1년 단위 재계약 상태로 유지한다.
                    if (!state.coachContractEndYear || state.coachContractEndYear <= state.year) state.coachContractEndYear = state.year + 1;
                    renderApp(); return;
                    }
                    const wasPromoted = state.pendingPromotion && state.tier === 2;
                    state.year++;
                    state.week = 1;
                    if (wasPromoted) {
                        const reg = VCT_DATA[state.regionKey];
                        if (reg) {
                            const currentTeam = { name: state.myTeamName, color: state.myTeamColor, power: calculateTeamPower(), w: 0, l: 0 };
                            const t1 = reg.t1.map(t => ({name:t.name,color:t.color,power:t.power,w:0,l:0}));
                            // 기존 1부 최하위 팀 자리를 승격팀이 차지한다.
                            t1.sort((a,b) => a.power - b.power);
                            t1[0] = currentTeam;
                            state.t1Teams = t1;
                            state.tier = 1;
                            state.pendingPromotion = false;
                            state.promotionSeason = null;
                            state.ascensionStage = 0;
                            state.logs.push(`⬆️ [${state.year} 시즌 개막] ${state.myTeamName}가 Ascension 우승으로 1부 VCT에 승격했습니다!`);
                            showToast(`${state.year}년 1부 VCT 승격 완료! 🏆`);
                        }
                    }

                    state.trainingDone = false;
                    state.sponsorDealsUsed = 0;
                    state.sponsorDealsMax = 2;
                    state.ascensionStage = 0;
                    state.pendingPromotion = false;
                    state.promotionSeason = null;
                    state.t1Teams.forEach(t => { t.w = 0; t.l = 0; t.power += 1; });
                    state.t2Teams.forEach(t => { t.w = 0; t.l = 0; t.power += 1; });
                    generateYouthProspects(2);
                    state.logs.push(`📢 [${state.year} 시즌 개막] 새로운 한 해가 시작되었습니다! 팀 전력이 상향되었습니다.`);
                    showToast(`${state.year}년 새 시즌이 개막했습니다!`);
                    renderApp();
                    return;
                }
            }

            if (!fromMatch) {
                const curPhase = getPhaseName(state.week);
                if (curPhase.type === 'offseason') {
                    state.week = 20;
                } else if (curPhase.type !== 'masters1' && curPhase.type !== 'masters2' && curPhase.type !== 'champions') {
                    simulateCpuMatches(null);
                }
            }

            state.week++;
            const nextPhase = getPhaseName(state.week);
            if (!['masters1','masters2','champions'].includes(nextPhase.type)) {
                state.internationalMatchesPlayed = 0;
                state.internationalMatchTarget = 0;
                state.internationalPhaseType = null;
            }
            state.trainingDone = false;
            if (Array.isArray(state.youth)) state.youth.forEach(y => { if (y.ovr < y.potential && Math.random() < (0.18 + state.youthLevel * 0.04) * getDifficultyConfig().growth) y.ovr = Math.min(y.potential, y.ovr + 1); });

            const weeklyWages = Math.round(state.players.reduce((sum, p) => sum + p.salary, 0) / 52);
            const fixedCost = (state.tier === 1 ? 40000 : 20000) * getDifficultyConfig().cost;
            state.cash -= Math.round(fixedCost + weeklyWages * getDifficultyConfig().cost);

            if (checkBankruptcy()) {
                renderApp();
                return;
            }

            if (state.cash < 0) {
                state.morale = Math.max(0, state.morale - 6);
                state.logs.push("⚠ 경고: 구단 자금 부족으로 인해 선수단 사기가 크게 하락했습니다.");
            }

            const newPhase = getPhaseName(state.week);
            if (state.week === 10) {
                const isQualified = checkTop4Qualification();
                state.logs.push(`🌍 [${state.year} Masters 1] 개막! (상위 4팀 진출 여부: ${isQualified ? '성공' : '실패'})`);
                openModal(`
                    <div class="text-center flex flex-col gap-4">
                        <div class="text-4xl">🌍</div>
                        <h2 class="text-2xl font-black text-val-accent">VALORANT Masters 1 개막!</h2>

                let namePool = [...INITIAL_NAMES].sort(() => Math.random() - 0.5);
                state.freeAgents = [];

                    const roleObj = ROLES[Math.floor(Math.random() * 5)];

            if (!fromMatch && state.week >= 17 && state.week <= 19) maybeGenerateCoachOffer(false);

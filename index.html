        }

        function signPlayer(index) {
            if (!careerActionAllowed()) return;
            if (!state || !Array.isArray(state.players) || !Array.isArray(state.freeAgents)) return;
            if (state.players.length >= 6) {
                showToast("로스터가 가득 찼습니다. 먼저 선수를 방출하세요.");
                return;
            }
            if (index < 0 || index >= state.freeAgents.length) {
                showToast("해당 선수를 찾을 수 없습니다.");
                return;
            }
            const p = state.freeAgents[index];
            if (!p) return;
            p.isStarter = state.players.length < 5;
            const fee = Math.round((p.salary || 0) * 0.4);

            if (state.cash < fee) {
                showToast("계약금이 부족합니다!");
                return;
            }

            state.cash -= fee;
            if (checkBankruptcy()) { renderApp(); return; }
            state.players.push(p);
            state.freeAgents.splice(index, 1);
            state.logs.push(`[영입] ${p.name} (${p.role}, OVR ${p.ovr}) 영입 완료.`);
            showToast(`${p.name} 영입 성공!`);
            renderApp();
        }

        function setPlayerLineup(index, isStarter) {
            if (!state || !Array.isArray(state.players)) return;
            const target = state.players[index];
            if (!target) return;

            if (isStarter === true) {
                if (target.isStarter === true) {
                    showToast(`${target.name}은(는) 이미 선발로 지정되어 있어.`);
                    return;
                }
                const starterCount = state.players.filter(p => p.isStarter === true).length;
                if (starterCount >= 5) {
                    showToast('선발은 최대 5명이야. 먼저 현재 선발 선수 중 한 명을 식스맨으로 직접 지정해 줘.');
                    return;
                }
                target.isStarter = true;
                showToast(`${target.name} 선발 지정 완료`);
            } else {
                if (target.isStarter === false) {
                    showToast(`${target.name}은(는) 이미 식스맨으로 지정되어 있어.`);
                    return;
                }
                if (state.players.length < 6) {
                    showToast('식스맨을 지정하려면 6명의 로스터가 필요해.');
                    return;
                }
                target.isStarter = false;
                showToast(`${target.name} 식스맨 지정 완료`);
            }
            renderApp();
        }

        // 이전 버전 호환: 기존 버튼/세이브에서 호출되어도 자동 교체는 하지 않는다.
        function toggleSixthMan(index) {
            const p = state?.players?.[index];
            if (!p) return;
            setPlayerLineup(index, p.isStarter === false);
        }

        function releasePlayer(index) {
            if (!careerActionAllowed()) return;
            // 교체 영입을 위해 4명까지는 일시적으로 허용합니다.
            // 5명 로스터에서 방출 -> 새 선수 영입 순서로 정상적인 교체가 가능합니다.
            if (!state || !Array.isArray(state.players)) return;
            if (index < 0 || index >= state.players.length) return;
            if (state.players.length <= 5) {
                showToast("최소 5명은 유지해야 합니다.");
                return;
            }

            const p = state.players[index];
            state.players.splice(index, 1);

            // 방출 선수는 FA 시장으로 이동시켜 다시 영입할 수 있게 합니다.
            if (!Array.isArray(state.freeAgents)) state.freeAgents = [];
            state.freeAgents.unshift(p);

            // 잔여 계약 보상금 15%
            state.cash += Math.round((p.salary || 0) * 0.15);
            state.logs.push(`[방출] ${p.name} 선수와의 계약을 해지했습니다. FA 시장으로 이동했습니다.`);
            showToast(`${p.name} 방출 완료. FA 시장에서 다시 영입할 수 있습니다.`);
            renderApp();
        }

        function doTrain(type) {
            if (state.trainingDone) {
                showToast("이번 주 훈련은 이미 마쳤습니다.");
                return;
            }
            state.trainingDone = true;

            if (type === 'aim') state.form = Math.min(100, state.form + 4);
            else if (type === 'tactic') { state.form = Math.min(100, state.form + 2); state.coach = Math.min(100, state.coach + 2); }
            else if (type === 'team') state.morale = Math.min(100, state.morale + 6);

            state.logs.push("이번 주 팀 주간 훈련을 성공적으로 마쳤습니다.");
            showToast("훈련 완료!");
            renderApp();
        }

        function upgradeStaff(type) {
            if (type === 'coach') {
                if (state.cash >= 55000) {
                    state.cash -= 55000;
                    state.coach = Math.min(100, state.coach + 10);
                    state.logs.push("코치진 연수를 지원하여 코칭 능력이 상승했습니다.");
                    showToast("코치 능력 상승!");
                    renderApp();
                } else showToast("자금이 부족합니다!");
            } else if (type === 'analyst') {
                if (state.cash >= 40000) {
                    state.cash -= 40000;
                    state.analyst = Math.min(100, state.analyst + 10);
                    state.logs.push("분석 시스템을 도입하여 데이터 분석력이 상승했습니다.");
                    showToast("분석력 상승!");
                    renderApp();
                } else showToast("자금이 부족합니다!");
            }
        }

        function signSponsor(type) {
            if (!careerActionAllowed()) return;
            state.sponsorDealsUsed = Number.isFinite(state.sponsorDealsUsed) ? state.sponsorDealsUsed : 0;
            state.sponsorDealsMax = Number.isFinite(state.sponsorDealsMax) ? state.sponsorDealsMax : 2;
            if (state.sponsorDealsUsed >= state.sponsorDealsMax) {
                showToast(`이번 시즌 스폰서 계약 한도(${state.sponsorDealsMax}회)에 도달했습니다.`);
                return;
            }
            if (type === 2 && state.reputation < 50) {
                showToast('글로벌 스폰서는 평판 50 이상이 필요합니다.');
                return;
            }
            const amount = type === 1 ? 70000 : 150000;
            state.cash += amount;
            state.sponsorDealsUsed++;
            state.reputation = Math.min(100, state.reputation + (type === 2 ? 3 : 1));
            state.logs.push(`[스폰서] ${type === 2 ? '글로벌 테크' : '지역 게이밍'} 스폰서 계약 완료 (+${formatMoney(amount)}) · ${state.sponsorDealsUsed}/${state.sponsorDealsMax}`);
            showToast(`스폰서 계약 완료! (${state.sponsorDealsUsed}/${state.sponsorDealsMax})`);
            renderApp();
        }

        window.onload = () => {
            try {
                renderApp();
            } catch (e) {
                console.error(e);
                document.getElementById('app').innerHTML = `
                    <div class="bg-val-panel border border-val-red text-white p-6 rounded-xl">
                        <h2 class="text-xl font-bold mb-2">실행 오류 발생</h2>
                        <p class="text-xs text-val-muted">${e.message}</p>
                    </div>
                `;
            }
        };
    </script>

<script id="nav-horizontal-scroll-js">
(function(){
  function enableNavScroll(){
    const nav=document.getElementById('global-nav');
    if(!nav || nav.dataset.scrollReady==='1') return;
    nav.dataset.scrollReady='1';

    // 세로 휠을 상단 메뉴의 가로 스크롤로 변환
    nav.addEventListener('wheel', function(e){
      if(nav.scrollWidth > nav.clientWidth && Math.abs(e.deltaY) > Math.abs(e.deltaX)){
        e.preventDefault();
        nav.scrollLeft += e.deltaY;
      }
    }, {passive:false});

    // 드래그 스크롤은 실제로 움직였을 때만 클릭을 막는다.
    // 따라서 탭을 그냥 클릭하면 onclick="navigate(...)"가 정상 실행된다.
    let down=false, dragging=false, startX=0, startScroll=0;
    nav.addEventListener('mousedown', function(e){
      if(e.button!==0) return;
      down=true; dragging=false; startX=e.clientX; startScroll=nav.scrollLeft;
    });
    window.addEventListener('mousemove', function(e){
      if(!down) return;
      const dx=e.clientX-startX;
      if(Math.abs(dx)>6){
        dragging=true;
        nav.scrollLeft=startScroll-dx;
      }
    });
    window.addEventListener('mouseup', function(){
      down=false;
      setTimeout(()=>{ dragging=false; },0);
    });
    nav.addEventListener('click', function(e){
      if(dragging){
        e.preventDefault();
        e.stopPropagation();
        dragging=false;
      }
    }, true);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', enableNavScroll);
  else enableNavScroll();
  const mo=new MutationObserver(enableNavScroll);
  mo.observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script><!-- VM_CACHE_UPDATE_FIX_V1 -->
(() => {
  // GitHub Pages/CDN 캐시 때문에 index.html이 오래된 상태로 남는 문제를 줄인다.
  // 현재 페이지가 먼저 로드된 뒤 HEAD로 최신 배포의 ETag/Last-Modified를 확인하고,
  // 변경되면 cache-busting URL로 한 번만 새로고침한다.
  const KEY='vm_last_server_version';
  let busy=false;
  async function checkForUpdate() {
    if (busy || document.visibilityState === 'hidden') return;
    busy=true;
    try {
      const url=location.pathname + (location.search ? location.search+'&' : '?') + '__vm_update_check=' + Date.now();
      const r=await fetch(url, {method:'HEAD', cache:'no-store', credentials:'same-origin'});
      if (!r.ok) return;
      const version=(r.headers.get('etag')||'')+'|'+(r.headers.get('last-modified')||'')+'|'+(r.headers.get('content-length')||'');
      const prev=sessionStorage.getItem(KEY);
      if (!prev) { sessionStorage.setItem(KEY,version); return; }
      if (version && prev !== version) {
        sessionStorage.setItem(KEY,version);
        const bust='__vm_v='+encodeURIComponent(version.slice(0,80));
        location.replace(location.pathname+'?'+bust);
      }
    } catch(e) {} finally { busy=false; }
  }
  setTimeout(checkForUpdate, 5000);
  setInterval(checkForUpdate, 30000);
})();
</script>
